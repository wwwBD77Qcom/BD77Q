<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SuperAce Deluxe VIP Mega Win Edition</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;align-items:center}

/* ১ থেকে ১০০% লোডিং স্ক্রিন */
#loader{
 position:fixed;inset:0;background:radial-gradient(circle,#0a1528,#02050b);z-index:9999;
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
 transition:opacity 0.5s ease;
}
.loader-title{font-size:32px;font-weight:1000;color:#ffdf73;letter-spacing:2px;text-shadow:0 0 15px rgba(255,215,0,0.8);margin-bottom:20px}
.loader-bar-container{width:260px;height:16px;background:#111;border:2px solid #d4af37;border-radius:10px;overflow:hidden;box-shadow:0 0 15px rgba(0,0,0,0.9)}
.loader-bar{width:0%;height:100%;background:linear-gradient(90deg,#ff8c00,#ffd700);border-radius:8px;transition:width 0.1s linear}
.loader-percent{margin-top:12px;font-size:18px;font-weight:bold;color:#00ffcc}

.game{
  width:min(100vw,520px);height:100vh;max-height:1000px;position:relative;
  overflow:hidden;color:white;display:none;
  background:radial-gradient(circle at 50% 40%, rgba(20,40,70,0.95) 0%, rgba(5,12,24,0.98) 60%, rgba(2,4,8,1) 100%),
             url('https://images.unsplash.com/photo-1518609878373-06d740f60d8b?auto=format&fit=crop&w=800&q=80') center/cover;
}
.woodTop{
 position:absolute;left:-5%;right:-5%;top:10.5%;height:15%;
 background:linear-gradient(180deg,#1a0d08,#421c10 25%,#240e06 70%,#0b0402);
 border-top:3px solid #d4af37;border-bottom:6px solid #855414;
 box-shadow:0 10px 20px rgba(0,0,0,0.8);z-index:1;
}
.logo-container{
 position:absolute;z-index:6;top:0.5%;left:0;right:0;text-align:center;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.logo{
 font-weight:1000;font-size:clamp(30px,7.5vw,44px);letter-spacing:1px;
 color:#fff6d1;-webkit-text-stroke:2px #5a1d05;
 text-shadow:0 3px 0 #ff8c00,0 5px 0 #8b2500,0 0 15px rgba(255,215,0,0.8);
 background:linear-gradient(180deg,#ffffff 20%,#ffdf73 60%,#f59b00 100%);
 -webkit-background-clip:text; -webkit-text-fill-color:transparent;
 filter:drop-shadow(0 4px 5px rgba(0,0,0,0.9));
}
.sub-logo{
 font-size:11px;font-weight:bold;letter-spacing:4px;color:#d4af37;
 text-transform:uppercase;margin-top:-2px;text-shadow:0 2px 4px rgba(0,0,0,0.9);
}

.mult-bar{
 position:absolute;z-index:8;top:17%;left:2%;right:2%;height:42px;border-radius:21px;
 border:3px solid #d4af37;background:linear-gradient(180deg,#2c200c,#161006);
 box-shadow:inset 0 2px 5px rgba(255,215,0,0.4),0 5px 12px rgba(0,0,0,0.8);
 display:flex;align-items:center;justify-content:space-around;
 color:#e6ca65;font-size:clamp(12px,3vw,16px);font-weight:1000;
}
.mult-bar span{padding:3px 6px;border-radius:10px;transition:.3s;border:1px solid transparent}
.mult-bar .active-mult{background:linear-gradient(135deg,#ff3300,#cc0000);color:#fff;border-color:#ffcc00;text-shadow:0 2px #500;box-shadow:0 0 10px #ff3300;transform:scale(1.15)}

.cards{
 position:absolute;z-index:10;left:1.8%;right:1.8%;top:23%;height:52%;
 display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);
 gap:5px;
}

.card{
 position:relative;overflow:hidden;border-radius:8px;border:2px solid #d4af37;
 background:linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%) !important;
 box-shadow:0 6px 12px rgba(0,0,0,0.7), inset 0 1px 3px rgba(255,255,0,0.6);
 display:flex;flex-direction:column;justify-content:space-between;padding:4px;
 transition:transform .25s ease, opacity .25s ease;
}
.card.drop{animation:dropAnim .3s ease both}
@keyframes dropAnim{
 0%{transform:translateY(-120px) scale(0.5);opacity:0}
 100%{transform:translateY(0) scale(1);opacity:1}
}

.card.matched{
 background:radial-gradient(circle,#fff7c2,#ffd700) !important;
 border-color:#ff0000 !important;
 transform:scale(0) rotate(20deg);
 opacity:0;
}

.card.scatter-card{
 background:linear-gradient(135deg, #4a0e65, #150226) !important;
 border:2px solid #00ffcc !important;
 box-shadow:0 0 18px #00ffcc, inset 0 0 10px #ff00ff !important;
 animation: scatterGlow 1.5s infinite alternate;
}
@keyframes scatterGlow{
 0%{box-shadow:0 0 10px #00ffcc, inset 0 0 5px #ff00ff}
 100%{box-shadow:0 0 22px #ff00ff, inset 0 0 12px #00ffcc}
}

.card-top{font-size:12px;font-weight:1000;line-height:1}
.card-bottom{font-size:12px;font-weight:1000;line-height:1;transform:rotate(180deg);align-self:flex-end}
.card-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px}

.red{color:#e60000 !important}
.black{color:#111111 !important}

.face-card{background:linear-gradient(135deg,#fffdfa,#fef6df) !important;border:2px solid #c79c2e !important;}
.face-content{
 position:absolute;inset:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 border:1.5px solid #dfc169;border-radius:4px;font-weight:1000;text-align:center;
 background:radial-gradient(circle,#ffffff,#f7f0df);
 box-shadow:inset 0 0 8px rgba(212,175,55,0.4);
}
.face-title{font-size:20px;letter-spacing:1px}

.match-msg{
 position:absolute;z-index:25;top:46%;left:50%;transform:translate(-50%,-50%) scale(0);
 background:rgba(5,10,20,0.96);border:3px solid #d4af37;border-radius:14px;
 padding:12px 20px;font-size:18px;font-weight:1000;color:#ffea00;
 text-shadow:2px 2px #000;transition:transform .2s ease;pointer-events:none;
 text-align:center;box-shadow:0 0 30px rgba(212,175,55,0.8);
 width:90%;
}
.match-msg.show{transform:translate(-50%,-50%) scale(1)}

.win-section{
 position:absolute;z-index:12;left:0;right:0;top:76%;height:5%;
 display:flex;align-items:center;justify-content:center;gap:12px;
 font-size:22px;font-weight:1000;text-shadow:2px 2px #000;
}
.win-section b{color:#ffe13d}

.bottom{
 position:absolute;z-index:13;left:0;right:0;bottom:0;height:19%;
 background:linear-gradient(180deg,#120703,#2b1106 30%,#090301);
 border-top:5px solid #d4af37;
}

.controls{
 position:absolute;z-index:15;left:3%;right:3%;bottom:6.5%;height:11%;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 8px;
}
.spin-btn{
 width:84px;height:84px;border-radius:50%;
 border:4px solid #fff;background:radial-gradient(circle,#ffd700 0,#ff8c00 60%,#b33600);
 box-shadow:0 0 18px #ffcc00,0 5px 10px #000;
 display:flex;align-items:center;justify-content:center;
 color:#fff;font-weight:1000;font-size:20px;cursor:pointer;text-align:center;
 text-shadow:0 2px 4px rgba(0,0,0,0.7);
}
.spin-btn:active{transform:scale(.92)}

.bet-balance-box{
 display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,0.6);
 padding:6px 10px;border-radius:8px;border:1px solid #d4af37;
}
.bet-control{
 display:flex;align-items:center;gap:6px;
}
.bet-btn{
 width:24px;height:24px;border-radius:50%;border:none;background:#d4af37;
 color:#000;font-weight:bold;font-size:14px;cursor:pointer;
 display:flex;align-items:center;justify-content:center;
}
.bet-btn:active{transform:scale(0.9)}
.balance-display{
 font-size:12px;color:#d4af37;text-shadow:1px 1px #000;font-weight:bold;
}
.balance-display b{color:#fff}
</style>
</head>
<body>

<!-- লোডিং স্ক্রিন -->
<div id="loader">
  <div class="loader-title">SUPER ACE DELUXE</div>
  <div class="loader-bar-container">
    <div class="loader-bar" id="loaderBar"></div>
  </div>
  <div class="loader-percent" id="loaderPercent">1%</div>
</div>

<div class="game" id="gameScreen">
 <div class="woodTop"></div>
 <div class="logo-container">
   <div class="logo">SUPER ACE</div>
   <div class="sub-logo">Deluxe VIP Edition</div>
 </div>

 <div class="mult-bar">
   <span id="m1" class="active-mult">×1</span>
   <span id="m2">×2</span>
   <span id="m3">×3</span>
   <span id="m5">×5</span>
   <span id="m10">×10</span>
   <span id="m20">×20</span>
   <span id="m50">×50</span>
 </div>

 <div class="cards" id="cardsGrid"></div>
 <div class="match-msg" id="matchMsg">COMBO!</div>

 <div class="win-section"><b>WIN</b> <span id="winAmount">0.000</span></div>
 <div class="bottom"></div>
 
 <div class="controls">
   <div style="font-size:12px;color:#d4af37">FreeSpin: <b id="freeCount" style="color:#00ffcc">0</b></div>
   
   <div class="bet-balance-box">
     <div class="bet-control">
       <button class="bet-btn" onclick="changeBet(-1)">-</button>
       <div style="font-size:12px;color:#d4af37">Bet: <b id="betVal" style="color:#fff">5</b></div>
       <button class="bet-btn" onclick="changeBet(1)">+</button>
     </div>
     <div class="balance-display">Bal: <b id="bal">232.150</b></div>
   </div>

   <div class="spin-btn" onclick="startSpin()">SPIN</div>
 </div>
</div>

<script>
let loadProgress = 1;
const barElem = document.getElementById('loaderBar');
const percentElem = document.getElementById('loaderPercent');
const loaderElem = document.getElementById('loader');
const gameScreen = document.getElementById('gameScreen');

let loadInterval = setInterval(() => {
  loadProgress += Math.floor(Math.random() * 5) + 2;
  if(loadProgress >= 100) {
    loadProgress = 100;
    clearInterval(loadInterval);
    setTimeout(() => {
      loaderElem.style.opacity = '0';
      setTimeout(() => {
        loaderElem.style.display = 'none';
        gameScreen.style.display = 'block';
      }, 500);
    }, 400);
  }
  barElem.style.width = loadProgress + '%';
  percentElem.textContent = loadProgress + '%';
}, 40);

const deckPool = [
 ['A', '♠', 'black'], ['K', '♠', 'black'], ['Q', '♠', 'black'], ['J', '♠', 'black'],
 ['10', '♠', 'black'], ['A', '♥', 'red'], ['K', '♥', 'red'], ['Q', '♥', 'red'],
 ['J', '♥', 'red'], ['10', '♥', 'red'], ['A', '♦', 'red'], ['K', '♦', 'red'],
 ['Q', '♦', 'red'], ['J', '♦', 'red'], ['10', '♦', 'red'], ['A', '♣', 'black'],
 ['K', '♣', 'black'], ['Q', '♣', 'black'], ['J', '♣', 'black'], ['10', '♣', 'black'],
 ['SCATTER', '👑', 'scatter']
];

let board = [];
for(let i=0; i<20; i++) {
 board.push(deckPool[Math.floor(Math.random()*(deckPool.length-1))]);
}

const grid = document.getElementById('cardsGrid');
let currentMultLevel = 0;
const multIds = ['m1', 'm2', 'm3', 'm5', 'm10', 'm20', 'm50'];
let isSpinning = false;
let freeSpinsLeft = 0;
let currentBet = 5;

function changeBet(amount) {
 currentBet += amount;
 if(currentBet < 1) currentBet = 1;
 if(currentBet > 100) currentBet = 100;
 document.getElementById('betVal').textContent = currentBet;
}

function speakBangla(text) {
 if ('speechSynthesis' in window) {
   window.speechSynthesis.cancel();
   let utterance = new SpeechSynthesisUtterance(text);
   utterance.lang = 'bn-BD';
   utterance.rate = 1.0;
   utterance.pitch = 1.1;
   window.speechSynthesis.speak(utterance);
 }
}

function playTuntunSound() {
 try {
   let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
   let now = audioCtx.currentTime;
   let osc1 = audioCtx.createOscillator();
   let gain1 = audioCtx.createGain();
   osc1.type = 'sine';
   osc1.frequency.setValueAtTime(1046.5, now);
   osc1.frequency.exponentialRampToValueAtTime(2093.0, now + 0.3);
   gain1.gain.setValueAtTime(0.3, now);
   gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
   osc1.connect(gain1);
   gain1.connect(audioCtx.destination);
   osc1.start(now);
   osc1.stop(now + 0.6);
 } catch(e) {}
}

function renderBoard(data) {
 grid.innerHTML = '';
 data.forEach((item, idx) => {
   const [val, suit, color] = item;
   const div = document.createElement('div');
   div.className = 'card drop';
   div.style.animationDelay = (idx * 0.015) + 's';

   if(val === 'SCATTER') {
     div.classList.add('scatter-card');
     div.innerHTML = `
       <div class="card-top" style="color:#00ffcc">VIP</div>
       <div class="face-content" style="background:linear-gradient(135deg,#200235,#3c055c);border-color:#00ffcc">
         <span style="font-size:9px;color:#00ffcc;font-weight:1000">SCATTER</span>
         <span style="font-size:22px">👑</span>
       </div>
       <div class="card-bottom" style="color:#00ffcc">VIP</div>
     `;
   } else if(val === 'K' || val === 'Q' || val === 'J' || val === 'A') {
     div.classList.add('face-card');
     let titleColor = color === 'red' ? 'red' : 'black';
     div.innerHTML = `
       <div class="card-top ${color}">${val}<br>${suit}</div>
       <div class="face-content">
         <span class="face-title ${titleColor}">${val}</span>
         <span style="font-size:16px" class="${color}">${suit}</span>
       </div>
       <div class="card-bottom ${color}">${val}<br>${suit}</div>
     `;
   } else {
     div.innerHTML = `
       <div class="card-top ${color}">${val}<br>${suit}</div>
       <div class="card-center ${color}">${suit}</div>
       <div class="card-bottom ${color}">${val}<br>${suit}</div>
     `;
   }
   grid.appendChild(div);
 });
}

renderBoard(board);

function startSpin() {
 if(isSpinning) return;
 executeSpin();
}

function executeSpin() {
 isSpinning = true;
 document.getElementById('winAmount').textContent = '0.000';
 document.getElementById('matchMsg').classList.remove('show');

 if(freeSpinsLeft > 0) {
   freeSpinsLeft--;
   document.getElementById('freeCount').textContent = freeSpinsLeft;
 } else {
   let balElem = document.getElementById('bal');
   let currentBal = parseFloat(balElem.textContent);
   if(currentBal < currentBet) {
     alert("Not enough balance!");
     isSpinning = false;
     return;
   }
   balElem.textContent = (currentBal - currentBet).toFixed(3);
 }

 currentMultLevel = 0;
 updateMultiplierUI();

 for(let i=0; i<20; i++) {
   let randItem;
   if (freeSpinsLeft > 0) {
     randItem = deckPool[Math.floor(Math.random() * 20)];
   } else {
     randItem = (Math.random() < 0.003) ? deckPool[20] : deckPool[Math.floor(Math.random() * 20)];
   }
   board[i] = randItem;
 }

 renderBoard(board);

 setTimeout(() => {
   checkScatterAndCascade();
 }, 500);
}

function checkScatterAndCascade() {
 let scatterCount = board.filter(item => item[0] === 'SCATTER').length;

 if(freeSpinsLeft <= 0 && scatterCount >= 3) {
   freeSpinsLeft = 12;
   document.getElementById('freeCount').textContent = freeSpinsLeft;

   playTuntunSound();

   let msgBox = document.getElementById('matchMsg');
   msgBox.innerHTML = `👑 MEGA JACKPOT SCATTER! 👑<br><span style="color:#00ffcc;font-size:18px">+12 FREE SPINS ACTIVATED!</span>`;
   msgBox.classList.add('show');

   setTimeout(() => {
     msgBox.classList.remove('show');
     processCascade();
   }, 3000);
 } else {
   processCascade();
 }
}

function processCascade() {
 let uniqueVals = ['A', 'K', 'Q', 'J', '10'];
 let targetVal = uniqueVals[Math.floor(Math.random() * uniqueVals.length)];
 
 let matchedIndices = [];
 board.forEach((item, idx) => {
   if(item[0] === targetVal) matchedIndices.push(idx);
 });

 let missChance = (freeSpinsLeft > 0) ? 0.30 : 0.86;
 
 let winMultiplierFactor = (freeSpinsLeft > 0) ? 2.5 : 1.2;

 if(matchedIndices.length < 3 || Math.random() < missChance) {
   let msgBox = document.getElementById('matchMsg');
   msgBox.textContent = `Try Again!`;
   msgBox.classList.add('show');
   setTimeout(() => {
     msgBox.classList.remove('show');
     finishSpinCycle();
   }, 500);
   return;
 }

 const cardNodes = grid.children;
 matchedIndices.forEach(idx => {
   if(cardNodes[idx]) cardNodes[idx].classList.add('matched');
 });

 let multipliersValues = [1, 2, 3, 5, 10, 20, 50];
 let currentMultiplier = multipliersValues[currentMultLevel];

 let msgBox = document.getElementById('matchMsg');
 msgBox.textContent = `MEGA WIN x${currentMultiplier}!`;
 msgBox.classList.add('show');

 let winInc = (matchedIndices.length * winMultiplierFactor * currentBet * currentMultiplier).toFixed(3);
 let winElem = document.getElementById('winAmount');
 let totalWin = parseFloat(winElem.textContent) + parseFloat(winInc);
 winElem.textContent = totalWin.toFixed(3);

 if(currentMultiplier >= 5 || totalWin >= (currentBet * 5)) {
   speakBangla("বিশাল জয়! অনেক টাকা জিতেছেন!");
 }

 let balElem = document.getElementById('bal');
 balElem.textContent = (parseFloat(balElem.textContent) + parseFloat(winInc)).toFixed(3);

 updateMultiplierUI();

 setTimeout(() => {
   msgBox.classList.remove('show');
   matchedIndices.forEach(idx => {
     board[idx] = deckPool[Math.floor(Math.random() * 20)];
   });
   renderBoard(board);

   currentMultLevel++;
   if(currentMultLevel < multIds.length && Math.random() > 0.40) {
     setTimeout(() => {
       processCascade();
     }, 600);
   } else {
     finishSpinCycle();
   }
 }, 450);
}

function finishSpinCycle() {
 isSpinning = false;
 if(freeSpinsLeft > 0) {
   setTimeout(() => {
     executeSpin();
   }, 700);
 }
}

function updateMultiplierUI() {
 multIds.forEach((id, i) => {
   document.getElementById(id).className = (i === currentMultLevel) ? 'active-mult' : '';
 });
}
</script>
</body>
</html>
