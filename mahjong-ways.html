<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHJONG WAYS - BALANCED EDITION</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { background: #000; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        /* লোডিং স্ক্রিন */
        #loading-screen {
            position: fixed; inset: 0; z-index: 100;
            background: linear-gradient(135deg, #030d07 0%, #0a2414 100%), 
                        url('https://images.unsplash.com/photo-1528164344705-475426879c0d?q=80&w=600&auto=format&fit=crop') no-repeat center center;
            background-blend-mode: overlay; background-size: cover;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
            transition: opacity 0.5s ease;
        }

        .loading-card {
            background: rgba(5, 15, 10, 0.85); border: 2px solid #d4af37; border-radius: 24px;
            padding: 30px; width: 100%; max-width: 320px; text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 15px rgba(212,175,55,0.2);
            backdrop-filter: blur(8px);
        }

        .loading-spinner-box {
            width: 70px; height: 70px; margin: 0 auto 16px auto; border-radius: 50%;
            background: linear-gradient(180deg, #1b633d, #0a311b); border: 2px solid #ffd700;
            display: flex; align-items: center; justify-content: center; font-size: 32px;
            box-shadow: 0 0 15px rgba(255,215,0,0.5); animation: pulseSpin 2s infinite ease-in-out;
        }

        @keyframes pulseSpin {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255,215,0,0.5); }
            50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(255,215,0,0.9); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255,215,0,0.5); }
        }

        .progress-bar-container {
            width: 100%; background: #020617; height: 10px; border-radius: 999px;
            overflow: hidden; border: 1px solid rgba(212,175,55,0.4); margin: 16px 0 8px 0; padding: 1px;
        }

        .progress-bar-fill {
            width: 0%; height: 100%; background: linear-gradient(90deg, #f59e0b, #facc15);
            border-radius: 999px; transition: width 0.05s linear;
        }

        /* গেম ফ্রেম */
        .game-frame {
            width: 100%; max-width: 420px; height: 100vh; max-height: 880px;
            background: radial-gradient(circle at 50% 20%, rgba(21,76,45,0.85) 0%, rgba(10,36,20,0.9) 60%, rgba(3,13,7,0.95) 100%), 
                        url('https://images.unsplash.com/photo-1528164344705-475426879c0d?q=80&w=600&auto=format&fit=crop') no-repeat center center;
            background-blend-mode: overlay; background-size: cover;
            border-left: 2px solid #d4af37; border-right: 2px solid #d4af37;
            box-shadow: 0 0 75px rgba(0,0,0,0.98); display: flex; flex-direction: column;
            justify-content: space-between; position: relative; overflow: hidden;
        }

        .roof-header {
            background: linear-gradient(180deg, #1b633d 0%, #0a311b 100%);
            border-bottom: 3px solid #ffcc00; padding-top: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.9);
        }
        .roof-tiles { display: flex; justify-content: space-between; padding: 0 2px; margin-bottom: 2px; }
        .roof-tile { width: 18px; height: 12px; background: linear-gradient(180deg, #38ef7d 0%, #11998e 100%); border-radius: 0 0 6px 6px; border: 1px solid #084c37; }

        .multiplier-bar {
            background: rgba(0,0,0,0.85); border: 1.5px solid #ffcc00; border-radius: 8px;
            margin: 4px 8px; padding: 4px 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .mult-val { font-size: 22px; font-weight: 900; font-style: italic; color: #8c6239; transition: all 0.3s; }
        .mult-val.active { color: #ffe600; transform: scale(1.25); text-shadow: 0 0 15px rgba(255,230,0,0.9); }

        #mystery-banner {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%) scale(0);
            background: linear-gradient(135deg, #fbbf24, #d97706); color: #000;
            padding: 8px 20px; border-radius: 999px; font-weight: 900; font-size: 15px;
            box-shadow: 0 0 25px rgba(251,191,36,0.9); z-index: 40; border: 2px solid #fff;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
        }
        #mystery-banner.show { transform: translateX(-50%) scale(1); }

        .board-container { padding: 0 8px; margin-top: -2px; }
        .tile-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
            background: rgba(0,0,0,0.5); padding: 6px; border-radius: 12px; border: 1.5px solid rgba(255,204,0,0.35);
            backdrop-filter: blur(4px);
        }
        .tile-slot {
            background: rgba(10,35,20,0.8); border: 1px dashed rgba(56,239,125,0.3);
            border-radius: 8px; aspect-ratio: 3 / 4.1; display: flex; align-items: center; justify-content: center;
        }

        @keyframes jellyDrop {
            0% { opacity: 0; transform: translateY(-180px) scale(0.4, 1.4); }
            60% { opacity: 1; transform: translateY(8px) scale(1.1, 0.9); }
            80% { transform: translateY(-4px) scale(0.95, 1.05); }
            100% { opacity: 1; transform: translateY(0) scale(1, 1); }
        }
        .mahjong-tile {
            animation: jellyDrop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            background: linear-gradient(180deg, #ffffff 0%, #f0f3f1 70%, #d5ded9 100%);
            border: 2px solid #ffffff; border-bottom: 6px solid #9eb0a6; border-right: 3px solid #b8c7bf;
            border-radius: 8px; box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .golden-tile {
            background: linear-gradient(180deg, #fff9c4 0%, #fbc02d 60%, #f57f17 100%);
            border: 2px solid #fffde7; border-bottom: 6px solid #b78103; border-right: 3px solid #d49a04;
            box-shadow: 0 0 20px rgba(255,215,0,0.9);
        }

        .tile-vanish { animation: vanishAnim 0.3s ease-in forwards; }
        @keyframes vanishAnim { 0% { transform: scale(1); opacity: 1; filter: brightness(2); } 100% { transform: scale(0); opacity: 0; } }

        .buy-btn-wrap { padding: 0 12px; margin-top: 4px; }
        .buy-feature-banner {
            background: linear-gradient(180deg, #e62117 0%, #a80f07 100%);
            border: 2px solid #ffcc00; border-radius: 20px; padding: 6px; text-align: center;
            color: #fffde7; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(230,33,23,0.7);
        }
        .buy-feature-banner:active { transform: scale(0.97); }

        .dashboard-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 10px; margin-top: 6px; }
        .dash-box { background: rgba(10,5,2,0.95); border: 1px solid #d4af37; border-radius: 10px; padding: 6px 4px; text-align: center; }
        .dash-label { font-size: 9px; color: #d4af37; font-weight: 700; }
        .dash-value { font-size: 13px; font-weight: 900; color: #ffd700; font-family: monospace; margin-top: 2px; }

        .controls-footer {
            background: linear-gradient(180deg, rgba(15,8,4,0.95) 0%, #000 100%);
            border-top: 1.5px solid #d4af37; padding: 10px 12px 14px 12px; display: flex; flex-direction: column; gap: 8px;
        }
        .control-btns { display: flex; align-items: center; justify-content: space-between; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(180deg, #2b1a10 0%, #140b06 100%);
            border: 1.5px solid #d4af37; color: #ffd700; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer;
        }
        .icon-btn:active { transform: scale(0.9); }

        .main-spin {
            width: 68px; height: 68px; border-radius: 50%;
            background: radial-gradient(circle, #ffea00 0%, #ff8c00 60%, #cc0000 100%);
            border: 4px solid #fff59d; box-shadow: 0 0 25px rgba(255,140,0,0.85);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .main-spin:active { transform: scale(0.92); }
        .spin-inner {
            width: 44px; height: 44px; border-radius: 50%; background: #d82315; border: 2px solid #ffeb3b;
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: bold;
        }
        .spinning { animation: spinSlow 0.6s linear infinite; }
        @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 50; padding: 16px; }
        .modal-box { background: linear-gradient(180deg, #0f172a 0%, #022c22 100%); padding: 24px; border-radius: 24px; border: 2px solid #f59e0b; text-align: center; max-width: 300px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- লোডিং স্ক্রিন -->
    <div id="loading-screen">
        <div class="loading-card">
            <div class="loading-spinner-box">🀄</div>
            <h2 style="color: #facc15; font-size: 18px; font-weight: 900; letter-spacing: 1px;">MAHJONG WAYS</h2>
            <p style="color: #94a3b8; font-size: 10px; margin-top: 2px;">লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
            
            <div class="progress-bar-container">
                <div id="progress-fill" class="progress-bar-fill"></div>

    <!-- গেম ফ্রেম -->
    <div class="game-frame">
        <!-- প্যাগোডা ছাদ -->
        <div class="roof-header">
            <div class="roof-tiles">
                <div class="roof-tile"></div><div class="roof-tile"></div><div class="roof-tile"></div><div class="roof-tile"></div>
                <div class="roof-tile"></div><div class="roof-tile"></div><div class="roof-tile"></div><div class="roof-tile"></div>
                <div class="roof-tile"></div><div class="roof-tile"></div><div class="roof-tile"></div><div class="roof-tile"></div>

        <!-- ফ্রি স্পিন কাউন্ট ডাউন -->
        <div id="free-spins-badge" style="display:none; text-align:center; background:linear-gradient(90deg, #f59e0b, #d97706); color:#000; font-weight:900; padding:2px 0; margin:0 12px; border-radius:999px; font-size:10px;">
            🎁 ফ্রি স্পিন বাকি: <span id="free-spins-count">10</span> টি
        </div>

        <div class="controls-footer">
            <div class="control-btns">
                <button class="icon-btn">🚀</button>
                <button id="power-btn" onclick="togglePower()" class="icon-btn" style="color: #8c6239;">⚡</button>
                <button class="icon-btn" onclick="adjustBet(-1)">-</button>

                <div class="main-spin" onclick="startSpinDeal()">
                    <div id="spin-icon-el" class="spin-inner">☯</div>
                </div>

                <button class="icon-btn" onclick="adjustBet(1)">+</button>
                <button id="auto-btn" onclick="toggleAutoPlay()" class="icon-btn">🤖</button>
                <button class="icon-btn">☰</button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:0 4px; font-size:8px; color:#f59e0b; font-family:monospace;">
                <span>MAHJONG WAYS v38.74</span>
                <span id="firebase-status" style="color:#38ef7d; font-weight:bold;">● LIVE</span>
            </div>
        </div>
    </div>

    <!-- উইন পপআপ -->
    <div id="win-modal" class="modal-bg">
        <div class="modal-box">
            <div style="font-size: 40px; margin-bottom: 8px;">🀄</div>
            <h2 id="win-modal-title" style="color: #f59e0b; font-size: 20px; font-weight: 900; margin-bottom: 8px;">WIN!</h2>
            <div style="background: #020617; padding: 10px; border-radius: 12px; border: 1px solid rgba(245,158,11,0.3); margin-bottom: 12px;">
                <div style="font-size: 9px; color: #94a3b8; text-transform: uppercase;">Prize Won</div>
                <div id="win-modal-amount" style="font-size: 24px; font-weight: 900; color: #facc15; margin-top: 4px;">+৳0.00</div>
            </div>
            <button onclick="closeWinModal()" style="width: 100%; background: linear-gradient(90deg, #facc15, #eab308); color: #020617; font-weight: 900; padding: 10px; border: none; border-radius: 10px; cursor: pointer;">COLLECT</button>
        </div>
    </div>

    <!-- ফায়ারবেজ মডিউল ও ব্যালেন্স সিংক লজিক -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDAJGU2sNTdx0sL7pqAaZX7sKRM0LrgYwU",
          authDomain: "uk77-56f6d.firebaseapp.com",
          databaseURL: "https://uk77-56f6d-default-rtdb.firebaseio.com",
          projectId: "uk77-56f6d",
          storageBucket: "uk77-56f6d.firebasestorage.app",
          messagingSenderId: "1062783431056",
          appId: "1:1062783431056:web:c44fd51195cf4061998315",
          measurementId: "G-C0ST13Q8PJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const currentUserKey = localStorage.getItem('aviator_current_user') || "user_12345";
        const userBalanceRef = ref(db, 'users/' + currentUserKey + '/balance');

        let liveBalance = 0.00;

        onValue(userBalanceRef, (snapshot) => {
            const val = snapshot.val();
            if (val !== null) {
                liveBalance = parseFloat(val);
            } else {
                try {
                    let usersDb = JSON.parse(localStorage.getItem('aviator_users_db')) || {};
                    if (usersDb[currentUserKey] && usersDb[currentUserKey].balance !== undefined) {
                        liveBalance = parseFloat(usersDb[currentUserKey].balance);
                    } else {
                        liveBalance = 1000.00; // ডিফল্ট ব্যালেন্স
                    }
                } catch (e) {
                    console.error("Local storage read error:", e);
                }
                set(userBalanceRef, liveBalance);
            }

            const balEl = document.getElementById('balance-val');
            if (balEl) {
                balEl.innerText = '৳' + liveBalance.toFixed(2);
            }
        });

        window.updateDatabaseBalance = function(newBalance) {
            liveBalance = parseFloat(newBalance.toFixed(2));
            
            set(userBalanceRef, liveBalance).catch(err => console.error("Firebase update error:", err));

            try {
                let usersDb = JSON.parse(localStorage.getItem('aviator_users_db')) || {};
                if (usersDb[currentUserKey]) {
                    usersDb[currentUserKey].balance = liveBalance;
                    localStorage.setItem('aviator_users_db', JSON.stringify(usersDb));
                }
            } catch (e) {
                console.error("Local storage update error:", e);
            }

            const balEl = document.getElementById('balance-val');
            if (balEl) {
                balEl.innerText = '৳' + liveBalance.toFixed(2);
            }
        };

        window.getUserBalance = function() {
            return liveBalance;
        };
    </script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let currentPercent = 0;
            const fillEl = document.getElementById('progress-fill');
            const textEl = document.getElementById('progress-text');
            const screenEl = document.getElementById('loading-screen');

            const loadInterval = setInterval(() => {
                currentPercent += Math.floor(Math.random() * 4) + 2;
                if (currentPercent >= 100) {
                    currentPercent = 100;
                    clearInterval(loadInterval);
                    setTimeout(() => {
                        screenEl.style.opacity = '0';
                        setTimeout(() => {
                            screenEl.style.display = 'none';
                        }, 500);
                    }, 200);
                }
                fillEl.style.width = currentPercent + '%';
                textEl.innerText = currentPercent + '%';
            }, 30);

            initBoardSlots();
        });

        let selectedBet = 3.00;
        let currentMult = 1;
        let isDealing = false;
        let powerActive = false;
        let autoPlay = false;
        let autoTimer = null;
        let freeSpins = 0;
        let boardState = [];

        const symbols = [
            { icon: '中', color: '#dc2626' },
            { icon: '發', color: '#059669' },
            { icon: '八萬', color: '#1d4ed8' },
            { icon: '88', color: '#047857' },
            { icon: '⦿⦿', color: '#4338ca' }
        ];

        function initBoardSlots() {
            const board = document.getElementById('main-grid-board');
            if (!board) return;
            board.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const slot = document.createElement('div');
                slot.className = 'tile-slot';
                slot.id = `slot-${i}`;
                board.appendChild(slot);
            }
        }

        function adjustBet(amt) {
            if (isDealing) return;
            selectedBet = Math.max(1, Math.min(100, selectedBet + amt));
            document.getElementById('bet-val').innerText = '৳' + selectedBet.toFixed(2);
        }

        function togglePower() {
            powerActive = !powerActive;
            const btn = document.getElementById('power-btn');
            btn.style.color = powerActive ? '#facc15' : '#8c6239';
        }

        function setMultiplier(m) {
            currentMult = m;
            [1, 2, 3, 5].forEach(val => {
                const el = document.getElementById(`m-${val}`);
                if (el) {
                    if (val === m) el.classList.add('active');
                    else el.classList.remove('active');
                }
            });
        }

        function generateRandomTile() {
            const sym = symbols[Math.floor(Math.random() * symbols.length)];
            const isGold = Math.random() < 0.10;
            return { sym, isGold, isScatter: false };
        }

        function buildTileHTML(tile) {
            if (tile.isScatter) {
                return `
                    <div class="mahjong-tile" style="border:2px solid #fde047; background:linear-gradient(180deg, #fde047, #f59e0b); color:#000; font-weight:900; font-size:9px;">
                        <span>SCAT</span><span style="font-size:16px;">🀄</span><span>FREE</span>
                    </div>
                `;
            }
            const goldClass = tile.isGold ? 'golden-tile' : '';
            return `
                <div class="mahjong-tile ${goldClass}">
                    <span style="font-size: 24px; color: ${tile.sym.color}; font-weight: 900;">${tile.sym.icon}</span>
                </div>
            `;
        }

        function startSpinDeal() {
            if (isDealing) return;

            let userBalance = window.getUserBalance ? window.getUserBalance() : 0;

            if (freeSpins <= 0) {
                if (userBalance < selectedBet) {
                    alert('পর্যাপ্ত ব্যালেন্স নেই!');
                    if (autoPlay) toggleAutoPlay();
                    return;
                }
                userBalance -= selectedBet;
            } else {
                freeSpins--;
                document.getElementById('free-spins-count').innerText = freeSpins;
                if (freeSpins <= 0) document.getElementById('free-spins-badge').style.display = 'none';
            }

            if (window.updateDatabaseBalance) {
                window.updateDatabaseBalance(userBalance);
            }

            isDealing = true;
            document.getElementById('spin-icon-el').classList.add('spinning');

            setMultiplier(1);
            initBoardSlots();

            boardState = Array.from({ length: 20 }, () => generateRandomTile());

            let winChance = powerActive ? 0.08 : 0.035;
            if (Math.random() < winChance) {
                let matchSym = symbols[Math.floor(Math.random() * symbols.length)];
                boardState[0].sym = matchSym;
                boardState[5].sym = matchSym;
                boardState[10].sym = matchSym;
            }

            let index = 0;
            const dropTimer = setInterval(() => {
                if (index < 20) {
                    const slot = document.getElementById(`slot-${index}`);
                    if (slot) slot.innerHTML = buildTileHTML(boardState[index]);
                    index++;
                } else {
                    clearInterval(dropTimer);
                    document.getElementById('spin-icon-el').classList.remove('spinning');
                    checkMatchesAndCascade();
                }
            }, 60);
        }

        function checkMatchesAndCascade() {
            let matches = [];
            for (let col = 0; col < 5; col++) {
                let colSyms = [
                    boardState[col].isScatter ? 'S' : boardState[col].sym.icon,
                    boardState[col+5].isScatter ? 'S' : boardState[col+5].sym.icon,
                    boardState[col+10].isScatter ? 'S' : boardState[col+10].sym.icon
                ];
                if (colSyms[0] === colSyms[1] && colSyms[1] === colSyms[2] && colSyms[0] !== 'S') {
                    matches.push(col, col+5, col+10);
                }
            }

            let scats = boardState.filter(t => t.isScatter).length;
            if (scats >= 3) {
                freeSpins += 10;
                document.getElementById('free-spins-count').innerText = freeSpins;
                document.getElementById('free-spins-badge').style.display = 'block';
            }

            if (matches.length > 0) {
                matches.forEach(i => {
                    const el = document.getElementById(`slot-${i}`);
                    if (el && el.firstElementChild) el.firstElementChild.classList.add('tile-vanish');
                });

                let mysteryBonus = 1;
                let hasMystery = Math.random() < 0.25;
                if (hasMystery) {
                    const mysteryValues = [2, 3, 5];
                    mysteryBonus = mysteryValues[Math.floor(Math.random() * mysteryValues.length)];
                    
                    const banner = document.getElementById('mystery-banner');
                    banner.innerText = `🔥 MYSTERY x${mysteryBonus}! 🔥`;
                    banner.classList.add('show');
                    setTimeout(() => {
                        banner.classList.remove('show');
                    }, 1800);
                }

                let multiplierBonus = (freeSpins > 0) ? 4.0 : 1.5;
                let win = selectedBet * multiplierBonus * currentMult * mysteryBonus;
                
                let userBalance = window.getUserBalance ? window.getUserBalance() : 0;
                userBalance += win;

                if (window.updateDatabaseBalance) {
                    window.updateDatabaseBalance(userBalance);
                }

                setTimeout(() => {
                    document.getElementById('win-val').innerText = '৳' + win.toFixed(2);
                    document.getElementById('win-modal-title').innerText = (freeSpins > 0) ? "FREE SPINS WIN! 🎁" : (hasMystery ? "BONUS WIN! 🌟" : "WIN! 🀄");
                    document.getElementById('win-modal-amount').innerText = '+৳' + win.toFixed(2);
                    document.getElementById('win-modal').style.display = 'flex';

                    matches.forEach(i => {
                        boardState[i] = generateRandomTile();
                        document.getElementById(`slot-${i}`).innerHTML = buildTileHTML(boardState[i]);
                    });

                    if (currentMult < 5) {
                        let nextM = currentMult === 1 ? 2 : (currentMult === 2 ? 3 : 5);
                        setMultiplier(nextM);
                    }
                }, 350);
            } else {
                document.getElementById('win-val').innerText = "৳0.00";
            }

            isDealing = false;

            if (freeSpins > 0 || autoPlay) {
                let delay = (freeSpins > 0) ? 1200 : 1600;
                autoTimer = setTimeout(startSpinDeal, delay);
            }
        }

        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            const btn = document.getElementById('auto-btn');
            btn.style.borderColor = autoPlay ? '#ffe600' : '#d4af37';
            if (autoPlay && !isDealing) startSpinDeal();
            else clearTimeout(autoTimer);
        }

        function buyFeatureClick() {
            if (isDealing) return;
            let cost = selectedBet * 50;
            let userBalance = window.getUserBalance ? window.getUserBalance() : 0;

            if (confirm(`৳${cost.toFixed(2)} দিয়ে ১০টি ফ্রি স্পিন কিনতে চান?`)) {
                if (userBalance >= cost) {
                    userBalance -= cost;
                    if (window.updateDatabaseBalance) {
                        window.updateDatabaseBalance(userBalance);
                    }
                    freeSpins += 10;
                    document.getElementById('free-spins-count').innerText = freeSpins;
                    document.getElementById('free-spins-badge').style.display = 'block';
                    startSpinDeal();
                } else {
                    alert('পর্যাপ্ত ব্যালেন্স নেই!');
                }
            }
        }

        function closeWinModal() {
            document.getElementById('win-modal').style.display = 'none';
        }
    </script>
</body>
</html>
