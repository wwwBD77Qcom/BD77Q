<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER ACE - COMPACT EDITION</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: #020912;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow-x: hidden;
        }

        .game-frame {
            background: radial-gradient(circle at 50% 20%, #1a3a5c 0%, #071526 60%, #020812 100%);
            border-left: 2px solid #204163;
            border-right: 2px solid #204163;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            width: 100%;
            max-width: 380px;
            height: 760px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            padding: 10px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 2px 4px;
        }

        .jili-logo {
            background: linear-gradient(130deg, #c29330, #ffea9f, #9e721d);
            border: 1px solid #fff3c4;
            box-shadow: 0 0 10px rgba(255,215,0,0.4);
            font-size: 9px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 4px;
            color: #3b2001;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .jackpot-badge {
            background: linear-gradient(to right, #d97706, #eab308);
            color: #030712;
            font-size: 9px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 9999px;
            border: 1px solid #fef08a;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .buy-bonus-btn {
            background: radial-gradient(circle, #e62222 0%, #800707 100%);
            border: 2px solid #ff9999;
            box-shadow: 0 0 15px rgba(230, 34, 34, 0.8);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 7px;
            font-weight: 900;
            line-height: 1.1;
            cursor: pointer;
        }

        .title-banner {
            text-align: center;
            margin: 2px 0;
            z-index: 10;
        }

        .title-banner h1 {
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
            background: linear-gradient(to bottom, #fef3c7, #facc15, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
        }

        .multiplier-bar-container {
            background: linear-gradient(180deg, #571b05 0%, #290a00 100%);
            border: 2px solid #a65917;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 5px 15px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 6px;
            z-index: 10;
            margin: 2px 0;
        }

        .multiplier-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            text-align: center;
        }

        .mult-pill {
            background: radial-gradient(circle, #422013 0%, #1a0a04 100%);
            border: 1px solid #733c14;
            color: #d18f45;
            font-weight: 900;
            padding: 4px 0;
            border-radius: 8px;
            font-size: 16px;
        }

        .mult-pill.active {
            background: radial-gradient(circle, #ffe47a 0%, #d48300 100%);
            border: 2px solid #ffffff;
            color: #4a1c00;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.9);
            transform: scale(1.08);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 5px;
            z-index: 10;
            margin: auto 0;
            padding: 0 2px;
        }

        .card-slot {
            background: rgba(10, 25, 43, 0.6);
            border: 1px dashed rgba(64, 114, 163, 0.4);
            border-radius: 6px;
            aspect-ratio: 3 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes jellyBounceDrop {
            0% { opacity: 0; transform: translateY(-150px) scale(0.3, 1.4); }
            50% { opacity: 1; transform: translateY(10px) scale(1.2, 0.8); }
            70% { transform: translateY(-6px) scale(0.9, 1.1); }
            85% { transform: translateY(3px) scale(1.03, 0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1, 1); }
        }

        .card-item {
            animation: jellyBounceDrop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            background: linear-gradient(180deg, #ffffff 0%, #e8ecef 100%);
            border: 2px solid #486581;
            border-radius: 6px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), 0 4px 10px rgba(0,0,0,0.6);
            width: 100%;
            height: 100%;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-weight: 900;
        }

        .card-item.golden {
            background: linear-gradient(180deg, #fff7d6 0%, #ffd043 100%);
            border: 2px solid #fff2a3;
            box-shadow: 0 0 12px rgba(255, 200, 0, 0.7);
        }

        .card-vanish {
            animation: cardDisappear 0.35s ease-in-out forwards;
        }

        @keyframes cardDisappear {
            0% { transform: scale(1); opacity: 1; filter: brightness(1.8); }
            50% { transform: scale(1.3) rotate(15deg); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .win-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            background: rgba(3, 7, 18, 0.8);
            border-radius: 8px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            font-weight: bold;
            font-size: 12px;
            z-index: 10;
            margin: 2px 0;
        }

        .win-bar span:first-child {
            text-transform: uppercase;
            font-weight: 900;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .win-bar span:last-child {
            font-size: 16px;
            font-weight: 900;
            font-family: monospace;
            color: #fde047;
        }

        .free-spins-badge {
            text-align: center;
            background: linear-gradient(to right, #eab308, #d97706);
            color: #030712;
            font-weight: 900;
            padding: 2px;
            border-radius: 9999px;
            font-size: 11px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .hidden { display: none !important; }

        .control-panel {
            background: rgba(3, 7, 18, 0.9);
            border-radius: 12px;
            padding: 6px;
            border: 1px solid #1e293b;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .total-balance-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 4px 10px;
        }

        .total-balance-bar .label {
            font-size: 10px;
            font-weight: 900;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .total-balance-bar .amount {
            font-size: 14px;
            font-weight: 900;
            color: #10b981;
            font-family: monospace;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .ctrl-btn {
            width: 32px;
            height: 32px;
            background: #1e293b;
            border-radius: 50%;
            border: 1px solid #334155;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }

        .bet-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0f172a;
            border: 1px solid #1e293b;
            padding: 2px 10px;
            border-radius: 9999px;
        }

        .bet-box button {
            background: none;
            border: none;
            color: #fbbf24;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
        }

        .bet-box span.label {
            font-size: 9px;
            color: #94a3b8;
            font-weight: bold;
            text-transform: uppercase;
        }

        .bet-box span.value {
            font-size: 12px;
            font-weight: 900;
            color: #facc15;
            font-family: monospace;
        }

        .spin-btn-gold {
            background: radial-gradient(circle, #ffe259 0%, #ffa751 100%);
            border: 3px solid #fff3b0;
            box-shadow: 0 0 20px rgba(255, 185, 0, 0.8), inset 0 2px 6px rgba(255,255,255,0.9);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #030712;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
        }

        .spin-btn-gold:active {
            transform: scale(0.92);
        }

        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            font-size: 9px;
            color: #64748b;
            font-family: monospace;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 16px;
        }

        .win-modal-box {
            background: linear-gradient(to bottom, #0f172a, #0f172a, #271302);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #f59e0b;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.7);
            animation: pulse-glow 1.5s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(234, 179, 8, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 45px rgba(234, 179, 8, 1); }
        }

        .text-red { color: #dc2626; }
        .text-dark { color: #0f172a; }
    </style>
</head>
<body>

    <!-- Compact Game Container -->
    <div class="game-frame">
        
        <!-- Header Controls -->
        <div class="header-controls">
            <div class="jili-logo">JILI</div>
            <div class="header-right">
                <div class="jackpot-badge">👑 JACKPOT LEGEND</div>
                <div class="buy-bonus-btn">
                    <span>BUY</span>
                    <span>BONUS</span>
                </div>
            </div>
        </div>

        <!-- Super Ace Title Banner -->
        <div class="title-banner">
            <h1>SuperAce</h1>
        </div>

        <!-- Multiplier Header Box -->
        <div class="multiplier-bar-container">
            <div class="multiplier-grid">
                <div id="mult-1" class="mult-pill active">×1</div>
                <div id="mult-2" class="mult-pill">×2</div>
                <div id="mult-3" class="mult-pill">×3</div>
                <div id="mult-5" class="mult-pill">×5</div>
            </div>
        </div>

        <!-- Main Card Board -->
        <div style="display: flex; justify-content: center; flex: 1; align-items: center;">
            <div class="card-grid" id="main-card-board" style="width: 100%;"></div>
        </div>

        <!-- Win Information Bar -->
        <div class="win-bar">
            <span>WIN</span>
            <span id="win-amount-display">0.000</span>
        </div>

        <!-- Free Spins Floating Badge -->
        <div id="free-spins-badge" class="free-spins-badge hidden">
            🎁 FREE SPINS: <span id="free-spins-count">10</span>
        </div>

        <!-- Bottom Game Controls -->
        <div class="control-panel">
            
            <!-- TOTAL BALANCE BAR -->
            <div class="total-balance-bar">
                <span class="label">💰 TOTAL BALANCE</span>
                <span class="amount" id="total-balance-display">৳1020.25</span>
            </div>

            <div class="control-row">
                <button class="ctrl-btn">⚙️</button>

                <div class="bet-box">
                    <button onclick="changeBet(-0.5)">-</button>
                    <span class="label">BET</span>
                    <span id="bet-display" class="value">0.5</span>
                    <button onclick="changeBet(0.5)">+</button>
                </div>

                <button id="spin-btn" onclick="dealCardsRandom()" class="spin-btn-gold">🔄</button>

                <button id="auto-btn" onclick="toggleAutoPlay()" class="ctrl-btn">🌀</button>

                <button id="power-btn" onclick="togglePower()" class="ctrl-btn" style="color: #ef4444;">⚡</button>
            </div>

            <div class="footer-info">
                <span>LV 2</span>
                <span id="firebase-status" style="color: #10b981; font-weight: bold;">● LIVE</span>
                <span>v_192_0008</span>
            </div>
        </div>

    </div>

    <!-- Win Popup Modal -->
    <div id="win-modal" class="modal-overlay hidden">
        <div class="win-modal-box">
            <div style="font-size: 36px; margin-bottom: 6px;">👑</div>
            <h2 style="font-size: 20px; font-weight: 900; color: #fbbf24; margin-bottom: 4px;">BIG WIN!</h2>
            <p style="font-size: 11px; color: #cbd5e1; margin-bottom: 12px;">তাস মিলে গেছে!</p>
            <div style="background: #030712; padding: 10px; border-radius: 10px; border: 1px solid rgba(245,158,11,0.3); margin-bottom: 12px;">
                <div style="font-size: 9px; color: #94a3b8; text-transform: uppercase; font-weight: 600;">Total Prize</div>
                <div id="win-amount" style="font-size: 24px; font-weight: 900; color: #facc15; margin-top: 2px;">+৳0.00</div>
            </div>
            <button onclick="closeWinModal()" style="width: 100%; background: linear-gradient(to right, #facc15, #eab308); color: #030712; font-weight: 900; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-size: 12px;">
                COLLECT
            </button>
        </div>
    </div>

    <!-- ফায়ারবেজ মডিউল ও সিংক লজিক -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDAJGU2sNTdx0sL7pqAaZX7sKRM0LrgYwU",
          authDomain: "uk77-56f6d.firebaseapp.com",
          databaseURL: "https://uk77-56f6d-default-rtdb.firebaseio.com",
          projectId: "uk77-56f6d",
          storageBucket: "uk77-56f6d.firebasestorage.app",
          messagingSenderId: "1062783431056",
          appId: "1:1062783431056:web:c44fd51195cf4061998315",
          measurementId: "G-C0ST13Q8PJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // লোকালস্টোরেজ থেকে রিয়েল ইউজার কি (Key) বের করা, না পেলে ডিফল্ট রাখা
        const currentUserKey = localStorage.getItem('aviator_current_user') || "user_12345";
        const userBalanceRef = ref(db, 'users/' + currentUserKey + '/balance');

        let liveBalance = 1020.25;

        // ফায়ারবেজ রিয়েল-টাইম ডাটাবেস থেকে লাইভ ব্যালেন্স রিড করা
        onValue(userBalanceRef, (snapshot) => {
            const val = snapshot.val();
            if (val !== null) {
                liveBalance = parseFloat(val);
            } else {
                // যদি ডাটাবেসে না থাকে, তবে লোকাল স্টোরেজ থেকে চেক করা
                try {
                    let usersDb = JSON.parse(localStorage.getItem('aviator_users_db')) || {};
                    if (usersDb[currentUserKey] && usersDb[currentUserKey].balance !== undefined) {
                        liveBalance = parseFloat(usersDb[currentUserKey].balance);
                    }
                } catch (e) {
                    console.error("Local storage read error:", e);
                }
                // ফায়ারবেজে ইনিশিয়াল ব্যালেন্স সেভ করে দেওয়া
                set(userBalanceRef, liveBalance);
            }

            // স্ক্রিনের ব্যালেন্স আপডেট করা
            const balEl = document.getElementById('total-balance-display');
            if (balEl) {
                balEl.innerText = '৳' + liveBalance.toFixed(2);
            }
        });

        // ফায়ারবেজ এবং লোকালস্টোরেজ উভয় জায়গাতেই ব্যালেন্স আপডেট করার ফাংশন
        window.updateDatabaseBalance = function(newBalance) {
            liveBalance = parseFloat(newBalance.toFixed(2));
            
            // ফায়ারবেজে আপডেট পাঠানো
            set(userBalanceRef, liveBalance).catch(err => console.error("Firebase update error:", err));

            // লোকাল স্টোরেজেও আপডেট রাখা যাতে সিংক মিস না হয়
            try {
                let usersDb = JSON.parse(localStorage.getItem('aviator_users_db')) || {};
                if (usersDb[currentUserKey]) {
                    usersDb[currentUserKey].balance = liveBalance;
                    localStorage.setItem('aviator_users_db', JSON.stringify(usersDb));
                }
            } catch (e) {
                console.error("Local storage update error:", e);
            }

            const balEl = document.getElementById('total-balance-display');
            if (balEl) {
                balEl.innerText = '৳' + liveBalance.toFixed(2);
            }
        };

        window.getUserBalance = function() {
            return liveBalance;
        };

        document.addEventListener("DOMContentLoaded", () => {
            initEmptyBoard();
        });
    </script>

    <script>
        let selectedBet = 0.5;
        let currentMultiplier = 1;
        let isDealing = false;
        let powerActive = false;
        let autoPlay = false;
        let autoTimer = null;
        let freeSpinsRemaining = 0;

        const suits = ['♠', '♥', '♦', '♣'];
        const values = ['A', 'K', 'Q', 'J', '10'];

        function initEmptyBoard() {
            const board = document.getElementById('main-card-board');
            if(!board) return;
            board.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const slot = document.createElement('div');
                slot.className = 'card-slot';
                slot.id = `slot-${i}`;
                board.appendChild(slot);
            }
        }

        function changeBet(amt) {
            if (isDealing) return;
            selectedBet = Math.max(0.5, Math.min(100, selectedBet + amt));
            document.getElementById('bet-display').innerText = selectedBet.toFixed(1);
        }

        function togglePower() {
            powerActive = !powerActive;
            const btn = document.getElementById('power-btn');
            if (powerActive) {
                if (btn) btn.style.color = "#facc15";
            } else {
                if (btn) btn.style.color = "#ef4444";
            }
        }

        function updateMultiplierUI(mult) {
            currentMultiplier = mult;
            const mults = [1, 2, 3, 5];
            mults.forEach(m => {
                const el = document.getElementById(`mult-${m}`);
                if (el) {
                    if (m === mult) el.classList.add('active');
                    else el.classList.remove('active');
                }
            });
        }

        function getRandomCard() {
            const suit = suits[Math.floor(Math.random() * suits.length)];
            const value = values[Math.floor(Math.random() * values.length)];
            const isRed = suit === '♥' || suit === '♦';
            const isGolden = Math.random() < 0.20; 
            const isScatter = Math.random() < 0.05; 
            return { value, suit, isRed, isGolden, isScatter };
        }

        function getCardHTML(card) {
            if (card.isScatter) {
                return `
                    <div class="card-item" style="border: 2px solid #fde047; background: linear-gradient(to bottom, #fde047, #fef08a, #d97706); color: #030712; align-items: center; justify-content: space-between;">
                        <span style="font-size: 10px;">SCAT</span>
                        <span style="font-size: 18px;">⭐</span>
                        <span style="font-size: 10px;">FREE</span>
                    </div>
                `;
            }

            const colorClass = card.isRed ? 'text-red' : 'text-dark';
            const goldenClass = card.isGolden ? 'golden' : '';

            return `
                <div class="card-item ${goldenClass}">
                    <span style="font-size: 11px; line-height: 1;" class="${colorClass}">${card.value}</span>
                    <span style="font-size: 20px; text-align: center; line-height: 1;" class="${colorClass}">${card.suit}</span>
                    <span style="font-size: 11px; line-height: 1; text-align: right;" class="${colorClass}">${card.value}</span>
                </div>
            `;
        }

        function dealCardsRandom() {
            if (isDealing) return;

            let currentBalance = window.getUserBalance ? window.getUserBalance() : 0;

            if (freeSpinsRemaining <= 0) {
                if (currentBalance < selectedBet) {
                    alert('অপর্যাপ্ত ব্যালেন্স বা কয়েন! দয়া করে ব্যালেন্স চেক করুন।');
                    if (autoPlay) toggleAutoPlay();
                    return;
                }
                currentBalance -= selectedBet;
                if (window.updateDatabaseBalance) {
                    window.updateDatabaseBalance(currentBalance);
                }
            } else {
                freeSpinsRemaining--;
                document.getElementById('free-spins-count').innerText = freeSpinsRemaining;
                if (freeSpinsRemaining <= 0) {
                    document.getElementById('free-spins-badge').classList.add('hidden');
                }
            }

            document.getElementById('total-balance-display').innerText = '৳' + currentBalance.toFixed(2);
            isDealing = true;

            const mults = [1, 2, 3, 5];
            const randMult = mults[Math.floor(Math.random() * mults.length)];
            updateMultiplierUI(randMult);

            initEmptyBoard();

            const cards = Array.from({ length: 20 }, () => getRandomCard());

            const winChance = powerActive ? 0.35 : 0.20;
            const forceWin = Math.random() < winChance;

            if (forceWin) {
                const matchVal = values[Math.floor(Math.random() * values.length)];
                cards[0].value = matchVal;
                cards[5].value = matchVal;
                cards[10].value = matchVal;
            }

            let slotIndex = 0;
            const dealInterval = setInterval(() => {
                if (slotIndex < 20) {
                    const slot = document.getElementById(`slot-${slotIndex}`);
                    if (slot) {
                        slot.innerHTML = getCardHTML(cards[slotIndex]);
                    }
                    slotIndex++;
                } else {
                    clearInterval(dealInterval);
                    evaluateMatch(cards);
                }
            }, 50);
        }

        function evaluateMatch(cards) {
            let matchedIndices = [];

            for (let col = 0; col < 5; col++) {
                let colValues = [
                    cards[col].value,
                    cards[col + 5].value,
                    cards[col + 10].value,
                    cards[col + 15].value
                ];
                
                if (colValues[0] === colValues[1] && colValues[1] === colValues[2]) {
                    matchedIndices.push(col, col + 5, col + 10);
                }
            }

            const won = matchedIndices.length >= 3;

            if (won) {
                matchedIndices.forEach(idx => {
                    const slot = document.getElementById(`slot-${idx}`);
                    if (slot && slot.firstElementChild) {
                        slot.firstElementChild.classList.add('card-vanish');
                    }
                });

                const winAmt = (selectedBet * 2.5 * currentMultiplier);
                let currentBalance = window.getUserBalance ? window.getUserBalance() : 0;
                currentBalance += winAmt;
                
                if (window.updateDatabaseBalance) {
                    window.updateDatabaseBalance(currentBalance);
                }

                document.getElementById('total-balance-display').innerText = '৳' + currentBalance.toFixed(2);

                setTimeout(() => {
                    document.getElementById('win-amount-display').innerText = winAmt.toFixed(3);
                    document.getElementById('win-amount').innerText = '+৳' + winAmt.toFixed(2);
                    document.getElementById('win-modal').classList.remove('hidden');
                }, 350);
            } else {
                document.getElementById('win-amount-display').innerText = "0.000";
            }

            isDealing = false;

            if (autoPlay || freeSpinsRemaining > 0) {
                autoTimer = setTimeout(dealCardsRandom, 1500);
            }
        }

        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            const btn = document.getElementById('auto-btn');
            if (autoPlay) {
                btn.style.color = '#facc15';
                if (!isDealing) dealCardsRandom();
            } else {
                btn.style.color = '';
                clearTimeout(autoTimer);
            }
        }

        function closeWinModal() {
            document.getElementById('win-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
