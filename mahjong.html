<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Ways - Realistic Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0b1a0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Logo Loading Screen Styles */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #13381a 0%, #06170a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .loader-logo-box {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            border: 3px solid #fff;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.8);
            margin-bottom: 20px;
            animation: pulseLogo 1.5s infinite alternate;
        }
        @keyframes pulseLogo {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(241,196,15,0.6); }
            100% { transform: scale(1.08); box-shadow: 0 0 30px rgba(241,196,15,1); }
        }
        .loader-title {
            font-size: 24px;
            font-weight: 900;
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        .loader-bar-frame {
            width: 260px;
            height: 14px;
            background: #061208;
            border-radius: 7px;
            border: 2px solid #f1c40f;
            overflow: hidden;
            padding: 2px;
        }
        .loader-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #27ae60);
            border-radius: 4px;
            transition: width 0.05s linear;
        }
        .loader-percent-text {
            margin-top: 10px;
            font-size: 15px;
            color: #e0ac69;
            font-weight: bold;
        }

        /* Game Container */
        .game-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 840px;
            background: linear-gradient(135deg, rgba(16,46,22,0.85) 0%, rgba(6,18,8,0.9) 100%), url('https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=600&auto=format&fit=crop') no-repeat center center/cover;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 4px solid #4a250a;
            box-shadow: 0 0 35px rgba(0,0,0,0.9);
        }

        /* Top Wooden Multiplier Banner */
        .top-banner {
            width: 94%;
            margin: 10px auto 0;
            background: linear-gradient(to bottom, #a32d1d, #61180f);
            border: 3px solid #f1c40f;
            border-radius: 12px;
            text-align: center;
            padding: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            position: relative;
        }
        .ways-text {
            font-size: 11px;
            color: #f39c12;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .multiplier-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 2px;
        }
        .mult-item {
            font-size: 18px;
            color: #e0ac69;
            font-weight: bold;
            font-style: italic;
        }
        .mult-item.active {
            color: #fff;
            font-size: 25px;
            text-shadow: 0 0 12px #ffcc00, 0 0 25px #ff8800;
            transform: scale(1.15);
        }

        /* Main Board Container */
        .board-wrapper {
            position: relative;
            width: 95%;
            margin: 0 auto;
            background: rgba(14, 46, 22, 0.95);
            border: 4px solid #5e310e;
            border-radius: 16px;
            padding: 10px 8px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slot-layout {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }

        .slot-cell {
            background: linear-gradient(180deg, #ffffff 0%, #f4f1ea 70%, #d8d2c4 100%);
            border: 2px solid #b8a376;
            border-bottom: 4px solid #9c8455;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 74px;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,1);
            transition: transform 0.2s;
        }

        .slot-cell.gold-tile {
            background: linear-gradient(180deg, #fff9d6 0%, #f1c40f 70%, #d4ac0d 100%);
            border: 2.5px solid #d4ac0d;
            border-bottom: 4px solid #b7950b;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.9);
        }
        
        .slot-cell.scatter-tile {
            background: linear-gradient(180deg, #ffcccc 0%, #e74c3c 70%, #900c3f 100%);
            border: 2.5px solid #ff0000;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.9);
        }

        .slot-cell.win {
            border-color: #27ae60;
            box-shadow: 0 0 15px #27ae60;
            transform: scale(1.05);
        }

        .tile-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .tile-char-red { color: #d63031; font-size: 26px; font-weight: 900; }
        .tile-char-green { color: #27ae60; font-size: 26px; font-weight: 900; }
        .tile-char-blue { color: #2980b9; font-size: 22px; font-weight: 900; }
        .scatter-text { color: #fff; font-size: 13px; font-weight: 900; text-shadow: 0 1px 3px rgba(0,0,0,0.8); text-align: center; }

        .free-spin-ribbon {
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: linear-gradient(to bottom, #a32d1d, #520d07);
            color: #f1c40f;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            padding: 5px 0;
            border: 2px solid #f1c40f;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* Bottom Control Panel */
        .control-panel {
            background: linear-gradient(to top, #06170a, #13381a);
            border-top: 3px solid #5e310e;
            padding: 10px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bottom-nav-icons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #3a1d07;
            font-size: 12px;
            color: #f1c40f;
            font-weight: bold;
        }
        .pg-badge {
            background: #4a250a;
            border: 1px solid #f1c40f;
            color: #f1c40f;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
        }

        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .bet-control {
            display: flex;
            align-items: center;
            background: #061208;
            border: 2px solid #5e310e;
            border-radius: 8px;
            overflow: hidden;
        }
        .bet-btn {
            background: #4a250a;
            color: #fff;
            border: none;
            width: 26px;
            height: 36px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .bet-display {
            padding: 0 8px;
            font-size: 11px;
            text-align: center;
            color: #f1c40f;
            font-weight: bold;
        }

        .spin-btn {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #f1c40f 0%, #27ae60 65%, #0e3b1c 100%);
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 18px rgba(39, 174, 96, 0.8);
        }
        .spin-btn:active { transform: scale(0.92); }
        .spin-inner { font-size: 24px; color: #fff; }
        
        .free-spin-alert {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(163, 45, 29, 0.95);
            border: 3px solid #f1c40f;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 0 25px #f1c40f;
            z-index: 100;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Logo Loading Screen -->
    <div id="loader-screen">
        <div class="loader-logo-box">🀄</div>
        <div class="loader-title">Mahjong Ways</div>
        <div class="loader-bar-frame">
            <div class="loader-bar-fill" id="loaderFill"></div>
        </div>
        <div class="loader-percent-text" id="loaderPercent">0%</div>
    </div>

<div class="game-container" id="gameContainer">
    <div class="free-spin-alert" id="freeSpinAlert">🎉 ৩টি স্ক্যাটার! ১০টি ফ্রি স্পিন শুরু হলো!</div>

    <!-- Top Multiplier Board -->
    <div class="top-banner">
        <div class="ways-text">1024 WAYS</div>
        <div class="multiplier-row">
            <div class="mult-item active" id="m1">x1</div>
            <div class="mult-item" id="m2">x2</div>
            <div class="mult-item" id="m3">x3</div>
            <div class="mult-item" id="m5">x5</div>
        </div>
    </div>

    <!-- Main Grid (5x4) -->
    <div class="board-wrapper">
        <div class="slot-layout" id="slotLayout"></div>
        <div class="free-spin-ribbon" id="spinStatusRibbon">✨ REALISTIC SLOT ENGINE ✨</div>
    </div>

    <!-- Bottom Interface Panel -->
    <div class="control-panel">
        <div class="bottom-nav-icons">
            <div>⚙️</div>
            <div>WIN: <span id="winAmount" style="color:#f1c40f;">Tk 0.00</span></div>
            <div class="pg-badge">PG</div>
            <div>BAL: <span id="balance" style="color:#f1c40f;">Tk 0.00</span></div>
            <div>❓</div>
        </div>

        <div class="action-row">
            <div class="bet-control">
                <button class="bet-btn" onclick="changeBet(-1)">-</button>
                <div class="bet-display">BET<br><span id="betValue">Tk 2.00</span></div>
                <button class="bet-btn" onclick="changeBet(1)">+</button>
            </div>
            
            <button class="spin-btn" onclick="spinReels()">
                <div class="spin-inner">🔄</div>
            </button>

            <div class="bet-control">
                <div class="bet-display" style="padding: 6px 10px;">AUTO<br><span>▶</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- লোকাল স্টোরেজ থেকে ড্যাশবোর্ডের ব্যালেন্স লোড এবং সিঙ্ক করার ফাংশন ---
    let usersDb = JSON.parse(localStorage.getItem('aviator_users_db')) || {};
    let currentUserPhone = localStorage.getItem('aviator_current_user') || null;

    function getDashboardBalance() {
        if (currentUserPhone && usersDb[currentUserPhone]) {
            return Number(usersDb[currentUserPhone].balance) || 0;
        }
        return Number(localStorage.getItem('balance')) || 0;
    }

    function saveDashboardBalance(newBalance) {
        if (currentUserPhone && usersDb[currentUserPhone]) {
            usersDb[currentUserPhone].balance = newBalance;
            localStorage.setItem('aviator_users_db', JSON.stringify(usersDb));
        }
        localStorage.setItem('balance', newBalance);
    }

    // Loading Progress Logic
    let progress = 0;
    const loaderFill = document.getElementById('loaderFill');
    const loaderPercent = document.getElementById('loaderPercent');
    const loaderScreen = document.getElementById('loader-screen');
    const gameContainer = document.getElementById('gameContainer');

    const loadTimer = setInterval(() => {
        progress += 4;
        loaderFill.style.width = progress + '%';
        loaderPercent.innerText = progress + '%';

        if (progress >= 100) {
            clearInterval(loadTimer);
            loaderScreen.style.opacity = '0';
            setTimeout(() => {
                loaderScreen.style.display = 'none';
                gameContainer.style.display = 'flex';
                balance = getDashboardBalance(); // গেম চালু হওয়ার সময় ড্যাশবোর্ডের ব্যালেন্স রিড করবে
                updateUI();
                initGrid();
            }, 600);
        }
    }, 30);

    // Sound Effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'spin') {
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'win') {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'scatter') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
    }

    const symbols = [
        { html: '<div class="tile-content"><span class="tile-char-green">發</span></div>', type: 'normal' },
        { html: '<div class="tile-content"><span class="tile-char-red">中</span></div>', type: 'normal' },
        { html: '<div class="tile-content"><span class="tile-char-blue">八萬</span></div>', type: 'normal' },
        { html: '<div class="tile-content"><span class="tile-char-blue" style="font-size:18px;">🀄🀫</span></div>', type: 'normal' },
        { html: '<div class="tile-content"><span class="scatter-text">SCATTER<br>胡</span></div>', type: 'scatter' }
    ];

    let balance = getDashboardBalance();
    let currentBet = 2.00;
    const betOptions = [0.41, 1.00, 2.00, 5.00, 10.00, 20.00];
    let betIndex = 2;
    let freeSpinsLeft = 0;
    let totalSpins = 0; 
    let lastScatterSpin = 0; 

    function initGrid() {
        const layout = document.getElementById('slotLayout');
        layout.innerHTML = '';
        for (let i = 0; i < 20; i++) {
            const cell = document.createElement('div');
            cell.className = 'slot-cell';
            if (i === 7) cell.classList.add('gold-tile');
            const randSym = symbols[Math.floor(Math.random() * (symbols.length - 1))];
            cell.innerHTML = randSym.html;
            cell.dataset.type = randSym.type;
            layout.appendChild(cell);
        }
    }

    function changeBet(direction) {
        if (freeSpinsLeft > 0) return;
        betIndex += direction;
        if (betIndex < 0) betIndex = 0;
        if (betIndex >= betOptions.length) betIndex = betOptions.length - 1;
        currentBet = betOptions[betIndex];
        document.getElementById('betValue').innerText = `Tk ${currentBet.toFixed(2)}`;
    }

    function spinReels() {
        balance = getDashboardBalance(); // স্পিন করার আগে রিয়েল ব্যালেন্স আপডেট করে নেওয়া হলো
        if (freeSpinsLeft <= 0 && balance < currentBet) {
            alert('অপর্যাপ্ত ব্যালেন্স!');
            return;
        }

        totalSpins++;

        if (freeSpinsLeft > 0) {
            freeSpinsLeft--;
            document.getElementById('spinStatusRibbon').innerText = `🎁 ফ্রি স্পিন বাকি: ${freeSpinsLeft} টি`;
            updateMultipliers(true);
        } else {
            balance -= currentBet;
            saveDashboardBalance(balance); // বেটের টাকা কেটে লোকাল স্টোরেজে সেভ করা হলো
            updateUI();
            updateMultipliers(false);
        }

        document.getElementById('winAmount').innerText = 'Tk 0.00';
        playSound('spin');
        
        const cells = document.querySelectorAll('.slot-cell');
        
        let forceScatter = false;
        if (totalSpins === 2) {
            forceScatter = true; 
        } else if (totalSpins - lastScatterSpin > 25 && Math.random() < 0.15) {
            forceScatter = true; 
        }

        let scatterPlacedCount = 0;

        cells.forEach((cell, index) => {
            cell.classList.remove('win', 'scatter-tile');
            let counter = 0;
            const spinInterval = setInterval(() => {
                let randSym;
                if (forceScatter && scatterPlacedCount < 3 && (index === 2 || index === 9 || index === 14)) {
                    randSym = symbols[4]; 
                    scatterPlacedCount++;
                } else {
                    const randChance = Math.random();
                    const symIndex = (randChance < 0.01) ? 4 : Math.floor(Math.random() * 4);
                    randSym = symbols[symIndex];
                }
                
                cell.innerHTML = randSym.html;
                cell.dataset.type = randSym.type;

                counter++;
                if (counter > 4 + (index % 4)) {
                    clearInterval(spinInterval);
                    if (randSym.type === 'scatter') {
                        cell.classList.add('scatter-tile');
                    } else if (Math.random() > 0.85) { 
                        cell.classList.add('win');
                    }

                    if (index === 19) {
                        checkScatters();
                    }
                }
            }, 40);
        });
    }

    function updateMultipliers(isFreeSpin) {
        document.querySelectorAll('.mult-item').forEach(el => el.classList.remove('active'));
        if (isFreeSpin) {
            document.getElementById('m5').classList.add('active');
        } else {
            const activeId = 'm' + [1, 2, 3, 5][Math.floor(Math.random() * 4)];
            document.getElementById(activeId).classList.add('active');
        }
    }

    function checkScatters() {
        let scatters = document.querySelectorAll('.slot-cell.scatter-tile');
        if (scatters.length >= 3) {
            freeSpinsLeft += 10;
            lastScatterSpin = totalSpins; 
            playSound('scatter');
            const alertBox = document.getElementById('freeSpinAlert');
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
        }

        let winMultiplier = 0;
        document.querySelectorAll('.slot-cell.win').forEach(() => {
            winMultiplier += (freeSpinsLeft > 0 ? 1.0 : 0.25); 
        });

        if (winMultiplier > 0) {
            let totalWin = currentBet * winMultiplier;
            balance = getDashboardBalance() + totalWin;
            saveDashboardBalance(balance); // জেতার পর টাকা যোগ করে ড্যাশবোর্ডে সেভ করা হলো
            document.getElementById('winAmount').innerText = `Tk ${totalWin.toFixed(2)}`;
            playSound('win');
            updateUI();
        } else {
            document.getElementById('winAmount').innerText = 'Tk 0.00 (Loss)';
        }

        if (freeSpinsLeft > 0) {
            setTimeout(() => {
                spinReels();
            }, 1200);
        }
    }

    function updateUI() {
        balance = getDashboardBalance();
        document.getElementById('balance').innerText = `Tk ${balance.toFixed(2)}`;
    }
</script>

</body>
</html>
